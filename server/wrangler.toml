# =====================================================================
# Cloudflare Workers 配置 · 润笔 · 授权服务
# =====================================================================
# 用法：
#   1. 在 Cloudflare Dashboard 建一个 D1 数据库（推荐名 gzh-license），
#      把它的 database_id 填到下方 [[d1_databases]].database_id；
#   2. 建一个 KV namespace（推荐名 gzh-license-rl，做接口限速），
#      把 id 填到下方 [[kv_namespaces]].id；
#   3. 用 `wrangler secret put XXX` 注入下面 [vars] 列表里所有 *_SECRET 字段
#      （生产建议用 secret，不要明文写在 wrangler.toml 里）：
#         wrangler secret put JWT_SECRET
#         wrangler secret put LS_WEBHOOK_SECRET
#         wrangler secret put LICENSE_SIGNING_SECRET
#   4. 初始化数据库：
#         wrangler d1 execute gzh-license --file=./server/schema.sql
#         wrangler d1 execute gzh-license --local --file=./server/schema.sql  # 本地
#   5. 本地起服务：    wrangler dev
#      生产部署：      wrangler deploy
# =====================================================================

name = "gzh-license"
main = "worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ---------------- Cron Trigger（定时任务） ----------------
# 每小时反查虎皮椒后台订单，把"虎皮椒已退款但 notify webhook 漏发"的订单
# 同步回 D1（worker.js scheduled handler → syncHupijiaoRefunds）。
# 单次最多查 50 条 90 天内 paid 订单，更老的退款窗口已关。
# CF 控制面板里也能看每次 cron 的执行日志：Workers → gzh-license → Logs。
[triggers]
crons = ["0 * * * *"]  # 每小时整点

# ---------------- D1 ----------------
[[d1_databases]]
binding       = "DB"
database_name = "gzh-license"
database_id   = "1cba3fd2-1dc2-42e9-9c93-18b57c42e074"

# ---------------- KV (限速 + 短期缓存) ----------------
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id      = "8a535d27955946f3a0b8f7b9c06717f5"

# ---------------- 公开变量（可明文） ----------------
[vars]
# 允许跨域访问的 Origin。多个用逗号分隔；插件端 chrome-extension://xxx 也写在这里。
# 39th 续³ Phase 5 加固：钉死具体扩展 ID 防任何第三方恶意扩展冒充本扩展调 worker（如 /api/llm/chat
# 偷 token、/api/me 拿用户信息）。chrome://extensions 里复制本扩展 ID 即可，开发版 + 上架版各一个。
# 旧通配 chrome-extension://* 已废弃；如需开发新版本时新增 ID，加到 ALLOWED_ORIGINS 列表里。
ALLOWED_ORIGINS = "https://docuearn.com,https://www.docuearn.com,chrome-extension://knmlfnpnbipgamapbhofnmjcpbjgbofl"

# 官网 dashboard 域名（用于注册/重置密码邮件、Lemon Squeezy 回跳）
SITE_URL = "https://docuearn.com"

# Lemon Squeezy store id 和 product/variant id（webhook 里用作过滤）
LS_STORE_ID    = ""
LS_VARIANT_IDS = ""   # 多个 variant 用逗号分隔；为空表示该 store 下所有 variant 都视作 Pro

# License key 前缀（不要带连字符）；用于 worker 端生成时区分环境
LICENSE_KEY_PREFIX = "GZHT"

# 39th 续³ Phase 5 加固 · 限速 KV 严格模式（生产环境强制）
# 当此 var = "1" 时，KV binding 缺失时关键路径（注册 / verify / LLM chat / LLM stream）直接返 503
# 避免 KV 漏配导致限速静默失效（注册 / verify / token spike / 邮件节流全部 fail-open 是 critical bug）
# 开发环境 .dev.vars **不要**设此 var → rateLimit fail-open 不阻塞调试
STRICT_RATE_LIMIT = "1"

# ---------------- 虎皮椒（HuPiJiao）支付通路 ----------------
# Worker 自身的对外完整 URL，用于拼 notify_url（虎皮椒回调）
WORKER_PUBLIC_URL = "https://api.docuearn.com"

# 虎皮椒 APPID（公开值，去 admin.xunhupay.com → 我的支付渠道 复制）
HUPIJIAO_APP_ID = "201906179316"

# 虎皮椒下单接口 URL（出问题可切备用平台 https://api.dpweixin.com/payment/do.html）
HUPIJIAO_API_URL = "https://api.xunhupay.com/payment/do.html"

# 注意：HUPIJIAO_APP_SECRET 是私密值，必须用 wrangler secret put 注入
# 千万不要明文写在这里。本地 .dev.vars 同理。

# ---------------- 密码重置邮件（Resend） ----------------
# RESEND_API_KEY 留空 → /api/auth/request-reset 不真发邮件，只 console.log 出 reset URL
# （开发期方便联调；生产强烈建议接 Resend，否则 OAuth-only 用户走"忘记密码"
#  流程会卡死——他们既没有密码，又收不到重置邮件）。
#
# 接入步骤详见 docs/RESEND_EMAIL_SETUP.md，关键命令：
#   wrangler secret put RESEND_API_KEY
#
# 发件人地址：默认 "no-reply@docuearn.com"。如需改：取消注释下一行。
# Resend 要求发件域名必须在 Resend 控制台「Domains」里完成 DNS 验证。
# RESET_EMAIL_FROM = "no-reply@docuearn.com"

# Google OAuth 2.0 Web Client ID
#   - 在 https://console.cloud.google.com/apis/credentials 新建 "OAuth 2.0 Client ID"
#     → 类型 "Web application"
#     → "Authorized JavaScript origins" 填 https://docuearn.com（以及任意要支持的域名）
#   - 拿到形如 1234567890-abc.apps.googleusercontent.com 的字符串填到这里
#   - 留空 → /api/auth/google 会返回 503，前端 Google 按钮不显示
#   - 这里和 site/assets/js/site-config.js 里的 GOOGLE_CLIENT_ID 必须保持一致
#     （前端用它去发起授权，后端用它校验返回的 ID Token aud 字段是否匹配）
GOOGLE_CLIENT_ID = "458035180234-4s4h5m2kjjrg7e2cgmuc1out8p14th17.apps.googleusercontent.com"

# ---------------- 私密变量（必须用 wrangler secret put） ----------------
# JWT_SECRET             —— 长度 ≥ 32 的随机字符串，用于 HS256
# LS_WEBHOOK_SECRET      —— Lemon Squeezy webhook 的 signing secret（不用 LS 时可留空）
# LICENSE_SIGNING_SECRET —— 用于 license key 校验位运算（与插件端无关，仅服务端用）
# HUPIJIAO_APP_SECRET    —— 虎皮椒 AppSecret（千万不能泄露！泄露后立刻去后台重置）
# RESEND_API_KEY         —— Resend 邮件服务 API Key（接入 docs/RESEND_EMAIL_SETUP.md）
# GOOGLE_CLIENT_ID 是公开值（前端也会用），不需要 secret，可直接放上面 [vars]
#
# --- 平台 LLM 代理（39th session 起）---
# 月费/Free 用户走 /api/llm/chat 时，由 worker 用下列 Key 调上游 LLM 服务商。
# 添加新上游时同步 server/llm/upstream.js 的 UPSTREAM_CONFIG。
# 注入命令（在 server/ 目录下）：
#   wrangler secret put OPENAI_API_KEY        —— OpenAI 官方 Key（flagship 档主力）
#   wrangler secret put DEEPSEEK_API_KEY      —— DeepSeek（economy / standard 档主力 + OpenAI fallback）
# 留空 → /api/llm/chat 调对应 upstream 时返回 503 "upstream_not_configured"
# 多 Key 池 / 轮转放将来（Phase 4 防滥用），当前单 Key 即可
