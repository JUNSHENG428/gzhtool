<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公众号改写排版台</title>
    <link rel="icon" type="image/svg+xml" href="../icons/icon.svg" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <p class="eyebrow">公众号助手</p>
      <h1>公众号改写排版台</h1>
      <p class="intro">
        一键抓取当前网页的正文和图片，用 AI 改写后整理成可直接发布的公众号稿件。
      </p>

      <div class="actions">
        <button id="captureAndOpen" class="primary">抓取当前页并打开编辑台</button>
        <button id="openWorkspace">只打开编辑台</button>
        <button id="openOptions">设置 API</button>
      </div>

      <div class="quick-links">
        <button id="openWelcome" class="link-button">快速开始</button>
        <button id="openHotTopics" class="link-button">热点捕捉</button>
        <button id="openHelp" class="link-button">帮助中心</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
