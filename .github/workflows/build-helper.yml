name: build-helper

# 触发：① 推 helper-v* tag 自动跑并发布 Release  ② 手动 dispatch 调试
on:
  push:
    tags:
      - "helper-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建不发布（true/false）"
        required: false
        default: "true"

permissions:
  contents: write  # 创建 Release 需要

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 = Apple Silicon。覆盖 2020 年后所有新 mac，95%+ 现役 mac 用户。
          - os: macos-14
            artifact: Runbi-Helper-mac-arm64.zip
            asset_name: Runbi-Helper-mac-arm64.zip
          - os: windows-latest
            artifact: Runbi-Helper-win-x64.zip
            asset_name: Runbi-Helper-win-x64.zip
          # 注：macos-13 (Intel) runner 在 GitHub 池子里供应紧张，单 job 排队
          # 经常 30 min ~ 几小时；首发暂时不发 Intel mac 包，等有真实 Intel
          # mac 用户反馈再单独补 helper-vX.Y.Z-intel 标签的小版本。

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      # —— mac 构建 —— #
      - name: Build (mac)
        if: runner.os == 'macOS'
        env:
          ARCH: arm64
        run: bash desktop/build/build_mac.sh

      # —— win 构建 —— #
      - name: Build (win)
        if: runner.os == 'Windows'
        shell: cmd
        run: desktop\build\build_win.bat

      - name: Show artifact info
        shell: bash
        run: |
          ls -lh dist/${{ matrix.artifact }} || (echo "✗ 缺失产物 dist/${{ matrix.artifact }}" && exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    # 只在 tag 推送时发 Release；workflow_dispatch 默认 dry-run
    if: startsWith(github.ref, 'refs/tags/helper-v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: List artifacts
        run: ls -lhR dist-all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-all/**/*.zip
          draft: false
          prerelease: false
