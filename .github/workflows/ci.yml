name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install fonts (for fonts:sync optional check)
        run: npm ci
      - name: Smoke
        run: npm run test:smoke
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Auth, payment and session regression tests
        run: npm run test:p1
      - name: Rewrite readability regression tests
        run: npm run test:rewrite-quality
