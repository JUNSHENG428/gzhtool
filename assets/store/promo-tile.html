<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>润笔 · 商店小图标 440×280</title>
    <style>
      :root {
        --bg-1: #f6f1e3;
        --bg-2: #ede2c4;
        --ink: #1f2d24;
        --ink-soft: #5e544c;
        --brand: #1f4329;
        --gold: #b78640;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", sans-serif;
        background: #888;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 40px;
      }
      .tile {
        width: 440px;
        height: 280px;
        border-radius: 14px;
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 90% 10%, rgba(183,134,64,0.18), transparent 60%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        position: relative;
        padding: 22px 26px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .brand-row {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: nowrap;
      }
      .brand-mark {
        width: 28px; height: 28px;
        border-radius: 7px;
        background: linear-gradient(135deg, var(--brand), #2d6e44);
        display: grid;
        place-items: center;
        color: #fff;
        font-family: "Noto Serif SC", serif;
        font-weight: 900;
        font-size: 16px;
        flex-shrink: 0;
      }
      .brand-name {
        font-family: "Noto Serif SC", serif;
        font-weight: 700;
        font-size: 16px;
        color: var(--ink);
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .brand-tag {
        font-size: 10.5px;
        color: var(--ink-soft);
        margin-left: auto;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .lead {
        margin: 0;
        font-family: "Noto Serif SC", serif;
        color: var(--ink);
        font-size: 26px;
        line-height: 1.22;
        font-weight: 700;
        letter-spacing: -0.005em;
      }
      .lead em {
        font-style: normal;
        background: linear-gradient(180deg, transparent 60%, rgba(183,134,64,0.35) 60%);
        padding: 0 2px;
      }
      .sub {
        margin: 0;
        color: var(--ink-soft);
        font-size: 12.5px;
        line-height: 1.55;
        max-width: 80%;
      }
      .badge {
        position: absolute;
        right: 24px; bottom: 22px;
        display: inline-flex;
        align-items: center;
        height: 26px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--brand);
        color: #fff;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      .deco-quote {
        position: absolute;
        left: -10px; top: -34px;
        font-family: "Noto Serif SC", serif;
        font-size: 220px;
        color: var(--brand);
        opacity: 0.06;
        line-height: 1;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="tile" id="capture-target">
      <div class="deco-quote">"</div>

      <div class="brand-row">
        <span class="brand-mark">润</span>
        <span class="brand-name">润笔 · DocuEarn</span>
        <span class="brand-tag">Chrome MV3</span>
      </div>

      <h1 class="lead">从抓素材到推草稿<br /><em>一个扩展跑完</em></h1>
      <p class="sub">知乎/X/小红书一键抓 · AI 按你的风格改写 · 6 套杂志级母版</p>

      <span class="badge">FREE TO START</span>
    </div>
  </body>
</html>
